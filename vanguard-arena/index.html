<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <title>MyanRena</title>
    <link rel="manifest" href="./manifest.json" />
    <script>
      // Auto-purge stale Service Workers & broken CSS caches on version upgrade
      (function () {
        var APP_VER = 'v9_clean';
        try {
          if (localStorage.getItem('myanrena_cache_ver') !== APP_VER) {
            localStorage.setItem('myanrena_cache_ver', APP_VER);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#070b14] text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
