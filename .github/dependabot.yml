version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/vanguard-arena"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - "firebase"
          - "firebase-admin"
          - "@firebase/*"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "tsx"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
