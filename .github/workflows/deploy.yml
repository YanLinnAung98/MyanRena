name: Build and Deploy MyanRena

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate package.json directory
        id: find_dir
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Found project in: $APP_DIR"
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ steps.find_dir.outputs.app_dir }}
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        working-directory: ${{ steps.find_dir.outputs.app_dir }}
        run: npx vite build

      - name: Copy all public assets into dist/assets
        run: |
          TARGET_DIR="${{ steps.find_dir.outputs.app_dir }}/dist/assets"
          mkdir -p "$TARGET_DIR"
          for src in "public/assets" "assets" "${{ steps.find_dir.outputs.app_dir }}/public/assets"; do
            if [ -d "$src" ]; then
              cp -rv "$src"/. "$TARGET_DIR"/ || true
            fi
          done
          for f in "$TARGET_DIR"/*.jpeg; do
            [ -e "$f" ] && cp -v "$f" "${f%.jpeg}.jpg" || true
          done
          for f in "$TARGET_DIR"/*.JPG; do
            [ -e "$f" ] && cp -v "$f" "${f%.JPG}.jpg" || true
          done
          ls -la "$TARGET_DIR"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dir.outputs.app_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
