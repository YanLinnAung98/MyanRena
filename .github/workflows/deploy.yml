name: Build and Deploy MyanRena to GitHub Pages

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "vanguard-arena/**"
      - "public/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "vanguard-arena/**"
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vanguard-arena
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Prepare GitHub Pages output
        working-directory: .
        run: |
          DIST_DIR="vanguard-arena/dist"
          mkdir -p "$DIST_DIR"
          # Preserve shared legacy assets and admin PWA entry points.
          for src in "public/assets" "assets" "vanguard-arena/public/assets"; do
            if [ -d "$src" ]; then
              mkdir -p "$DIST_DIR/assets"
              cp -rv "$src"/. "$DIST_DIR/assets"/ || true
            fi
          done
          for f in admin.html admin-manifest.json admin-sw.js; do
            for dir in "." "public" "vanguard-arena" "vanguard-arena/public"; do
              if [ -f "$dir/$f" ]; then
                cp -v "$dir/$f" "$DIST_DIR/$f"
                break
              fi
            done
          done
          # GitHub Pages does not provide SPA rewrites; use the app shell as fallback.
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          touch "$DIST_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vanguard-arena/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
