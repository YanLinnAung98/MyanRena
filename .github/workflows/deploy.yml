name: Build and Deploy MyanRena to GitHub Pages

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "vanguard-arena/**"
      - "public/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "vanguard-arena/**"
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vanguard-arena
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Report dependency security advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Dependency audit counts:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const advisories = (item.via || [])
              .filter((entry) => typeof entry === 'object')
              .map((entry) => `${entry.title} [${entry.url || 'no advisory URL'}]`);
            console.log(`${item.severity.toUpperCase()} ${name}: direct=${item.isDirect}, range=${item.range}, fix=${JSON.stringify(item.fixAvailable)}, advisories=${advisories.join('; ')}`);
          }
          NODE
          npm audit --audit-level=moderate

      - name: Build production bundle
        run: npm run build

      - name: TypeScript validation
        run: npm run lint

      - name: Game engine regression tests
        run: npm test

      - name: Backend startup and authentication smoke test
        env:
          NODE_ENV: production
          PORT: 3187
          DATA_DIR: ${{ runner.temp }}/myanrena-backend-smoke
        run: |
          mkdir -p "$DATA_DIR"
          npm start > "$RUNNER_TEMP/myanrena-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/myanrena-server.log"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import WebSocket from 'ws';

          const base = `http://127.0.0.1:${process.env.PORT}`;
          const username = `ci_${Date.now().toString(36)}`;
          const username2 = `${username}_b`;
          const password = `Smoke-${randomBytes(18).toString('hex')}-Aa9!`;
          const resetPassword = `Reset-${randomBytes(18).toString('hex')}-Bb8!`;

          async function post(path, body, token) {
            return fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
              },
              body: JSON.stringify(body),
            });
          }

          const health = await fetch(`${base}/healthz`);
          assert.equal(health.status, 200, 'health endpoint should respond');
          assert.equal((await health.json()).ok, true, 'health endpoint should report ok');

          const register = await post('/api/auth/register', {
            username, password, displayName: 'CI Smoke Player A',
          });
          const registered = await register.json();
          assert.equal(register.status, 200, `first registration should succeed: ${registered.error || ''}`);
          assert.ok(/^\d{6}$/.test(registered.recoveryPin), 'registration should return a six-digit recovery PIN');

          const login = await post('/api/auth/login', { username, password });
          const loggedIn = await login.json();
          assert.equal(login.status, 200, `login should succeed: ${loggedIn.error || ''}`);
          assert.ok(loggedIn.token, 'login should return a session token');

          const register2 = await post('/api/auth/register', {
            username: username2, password, displayName: 'CI Smoke Player B',
          });
          const registered2 = await register2.json();
          assert.equal(register2.status, 200, `second registration should succeed: ${registered2.error || ''}`);
          assert.ok(registered2.token, 'second player should receive a session token');

          const social = await fetch(`${base}/api/social`, {
            headers: { Authorization: `Bearer ${loggedIn.token}` },
          });
          assert.equal(social.status, 200, 'authenticated social API should respond');
          let socialData = await social.json();
          assert.ok(Array.isArray(socialData.friends), 'social API should return friend IDs');
          assert.ok(Array.isArray(socialData.relatedUsers), 'social API should return related profiles');

          const request = await post('/api/social/requests', { targetUserId: registered2.user.id }, loggedIn.token);
          assert.equal(request.status, 200, 'friend request should be created');
          const requestId = `${registered.user.id}__${registered2.user.id}`;

          const accept = await post(`/api/social/requests/${encodeURIComponent(requestId)}/accept`, {}, registered2.token);
          assert.equal(accept.status, 200, 'recipient should accept friend request');

          const friendsRes = await fetch(`${base}/api/social`, {
            headers: { Authorization: `Bearer ${loggedIn.token}` },
          });
          socialData = await friendsRes.json();
          assert.ok(socialData.friends.includes(registered2.user.id), 'accepted friend should appear in social graph');

          const dm = await post('/api/social/messages', {
            targetUserId: registered2.user.id, content: 'CI direct message smoke test',
          }, loggedIn.token);
          const dmData = await dm.json();
          assert.equal(dm.status, 200, `direct message should send: ${dmData.error || ''}`);
          assert.equal(dmData.message?.text, 'CI direct message smoke test', 'sent message should be returned');

          const block = await post(`/api/social/blocks/${encodeURIComponent(registered2.user.id)}`, {}, loggedIn.token);
          assert.equal(block.status, 200, 'blocking a player should succeed');
          const blockedMessage = await post('/api/social/messages', {
            targetUserId: registered2.user.id, content: 'This must be rejected',
          }, loggedIn.token);
          assert.equal(blockedMessage.status, 403, 'blocked players should not receive messages');

          const unblock = await fetch(`${base}/api/social/blocks/${encodeURIComponent(registered2.user.id)}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${loggedIn.token}` },
          });
          assert.equal(unblock.status, 200, 'unblocking a player should succeed');

          const recover = await post('/api/auth/recover-pin', {
            username, pin: registered.recoveryPin, newPassword: resetPassword,
          });
          assert.equal(recover.status, 200, 'Recovery PIN should reset the password');

          const recoveredLogin = await post('/api/auth/login', { username, password: resetPassword });
          const recovered = await recoveredLogin.json();
          assert.equal(recoveredLogin.status, 200, `new password should authenticate: ${recovered.error || ''}`);
          assert.ok(recovered.token, 'recovered login should return a new session token');

          function attachSocket(token) {
            const ws = new WebSocket(`ws://127.0.0.1:${process.env.PORT}/ws?token=${encodeURIComponent(token)}`);
            const backlog = [];
            const waiters = [];

            ws.on('message', (buffer) => {
              let message;
              try { message = JSON.parse(buffer.toString()); } catch { return; }
              const index = waiters.findIndex((waiter) => waiter.predicate(message));
              if (index >= 0) {
                const [waiter] = waiters.splice(index, 1);
                clearTimeout(waiter.timer);
                waiter.resolve(message);
              } else {
                backlog.push(message);
              }
            });

            const waitFor = (predicate, timeoutMs = 10000) => {
              const index = backlog.findIndex(predicate);
              if (index >= 0) return Promise.resolve(backlog.splice(index, 1)[0]);
              return new Promise((resolve, reject) => {
                const waiter = {
                  predicate,
                  resolve,
                  timer: setTimeout(() => {
                    const idx = waiters.indexOf(waiter);
                    if (idx >= 0) waiters.splice(idx, 1);
                    reject(new Error('Timed out waiting for an expected realtime event.'));
                  }, timeoutMs),
                };
                waiters.push(waiter);
              });
            };

            return { ws, waitFor };
          }

          const playerA = attachSocket(recovered.token);
          const playerB = attachSocket(registered2.token);
          const [initA, initB] = await Promise.all([
            playerA.waitFor((message) => message.type === 'init' || message.type === 'auth:error'),
            playerB.waitFor((message) => message.type === 'init' || message.type === 'auth:error'),
          ]);
          assert.equal(initA.type, 'init', `player A WebSocket auth should succeed: ${initA.error || ''}`);
          assert.equal(initA.user?.id, registered.user.id, 'WebSocket should authenticate player A');
          assert.equal(initB.type, 'init', `player B WebSocket auth should succeed: ${initB.error || ''}`);
          assert.equal(initB.user?.id, registered2.user.id, 'WebSocket should authenticate player B');

          const matchA = playerA.waitFor((message) => message.type === 'match:state' && message.match?.gameType === 'ttt');
          playerA.ws.send(JSON.stringify({
            type: 'queue:join', gameType: 'ttt', bestOf: 3, autoBotFill: false,
          }));

          const matchB = playerB.waitFor((message) => message.type === 'match:state' && message.match?.gameType === 'ttt');
          playerB.ws.send(JSON.stringify({
            type: 'queue:join', gameType: 'ttt', bestOf: 3, autoBotFill: false,
          }));

          const [pairedA, pairedB] = await Promise.all([matchA, matchB]);
          const matchId = pairedA.match.id;
          assert.ok(matchId, 'server matchmaking should create a match ID');
          assert.equal(pairedB.match.id, matchId, 'both players should receive the same match');
          assert.equal(pairedA.match.state?.gameType, 'ttt', 'match should start with the requested game');

          const moveA = playerB.waitFor((message) =>
            message.type === 'match:state' &&
            message.match?.id === matchId &&
            message.match.state?.board?.[0] === 1
          );
          playerA.ws.send(JSON.stringify({
            type: 'match:move', matchId, payload: { index: 0 },
          }));
          await moveA;

          const moveB = playerA.waitFor((message) =>
            message.type === 'match:state' &&
            message.match?.id === matchId &&
            message.match.state?.board?.[1] === 2
          );
          playerB.ws.send(JSON.stringify({
            type: 'match:move', matchId, payload: { index: 1 },
          }));
          await moveB;

          const chatEvent = playerB.waitFor((message) =>
            message.type === 'match:chat' && message.matchId === matchId &&
            message.message?.content === 'CI realtime match chat'
          );
          playerA.ws.send(JSON.stringify({
            type: 'match:chat', matchId, content: 'CI realtime match chat',
          }));
          await chatEvent;

          playerA.ws.close();
          playerB.ws.close();
          console.log('Backend smoke test passed: health, register/login/recovery, friend requests, block/DM, WebSocket auth, PvP matchmaking, alternating TTT moves and match chat.');
          NODE

      - name: Prepare GitHub Pages output
        working-directory: .
        run: |
          DIST_DIR="vanguard-arena/dist"
          mkdir -p "$DIST_DIR"
          # Preserve shared legacy assets and admin PWA entry points.
          for src in "public/assets" "assets" "vanguard-arena/public/assets"; do
            if [ -d "$src" ]; then
              mkdir -p "$DIST_DIR/assets"
              cp -rv "$src"/. "$DIST_DIR/assets"/ || true
            fi
          done
          for f in admin.html admin-manifest.json admin-sw.js; do
            for dir in "." "public" "vanguard-arena" "vanguard-arena/public"; do
              if [ -f "$dir/$f" ]; then
                cp -v "$dir/$f" "$DIST_DIR/$f"
                break
              fi
            done
          done
          # GitHub Pages does not provide SPA rewrites; use the app shell as fallback.
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          touch "$DIST_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vanguard-arena/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
