name: Build Standalone Admin Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Standalone Admin Assets
        run: |
          mkdir -p admin-apk-build/www
          ADMIN_FILE=""
          for path in "./admin.html" "./public/admin.html" "./vanguard-arena/admin.html" "./vanguard-arena/public/admin.html"; do
            if [ -f "$path" ]; then
              ADMIN_FILE="$path"
              break
            fi
          done
          if [ -z "$ADMIN_FILE" ]; then
            echo "ERROR: admin.html ဖိုင်ကို Repository ထဲတွင် ရှာမတွေ့ပါ။"
            exit 1
          fi
          cp "$ADMIN_FILE" admin-apk-build/www/index.html

      - name: Initialize Capacitor & Configure Dark Native Theme
        working-directory: admin-apk-build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Vanguard Admin" "com.vanguard.admin" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.vanguard.admin",
            "appName": "Vanguard Admin",
            "webDir": "www",
            "backgroundColor": "#070b14",
            "android": {
              "backgroundColor": "#070b14",
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Inject MLBB-Style True Immersive Full-Screen Mode
        working-directory: admin-apk-build
        run: |
          cat << 'EOF' > android/app/src/main/java/com/vanguard/admin/MainActivity.java
          package com.vanguard.admin;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableImmersiveMode();
                  }
              }

              private void enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(
                      getWindow(),
                      getWindow().getDecorView()
                  );
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF

      - name: Compile Standalone Android APK
        working-directory: admin-apk-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Vanguard-Admin-Standalone-APK
          path: admin-apk-build/android/app/build/outputs/apk/debug/app-debug.apk
