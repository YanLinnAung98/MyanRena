name: Build Vanguard Arena Game APK

on:
  workflow_dispatch:

jobs:
  build-game-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (for Android Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Offline Fallback Page
        run: |
          mkdir -p game-apk-build/www
          cat << 'EOF' > game-apk-build/www/index.html
          <!DOCTYPE html>
          <html lang="my">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Vanguard Arena</title>
            <style>
              body { margin:0; min-height:100vh; background:#070b14; color:#f8fafc; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
              .box { max-width:320px; background:#0d1322; border:1px solid rgba(245,158,11,0.35); border-radius:20px; padding:24px; }
              h2 { margin:0 0 8px; color:#fbbf24; font-size:18px; }
              p { margin:0 0 18px; color:#94a3b8; font-size:13px; line-height:1.5; }
              button { width:100%; height:44px; border:none; border-radius:12px; background:linear-gradient(135deg,#f59e0b,#d97706); color:#090d16; font-weight:800; font-size:14px; }
            </style>
          </head>
          <body>
            <div class="box">
              <h2>အင်တာနက် ချိတ်ဆက်မှု မရှိပါ</h2>
              <p>Vanguard Arena သို့ ဝင်ရောက်ရန်နှင့် နောက်ဆုံး Update ဒေတာများ ရယူရန် Wi-Fi သို့မဟုတ် Mobile Data ဖွင့်ပေးပါ။</p>
              <button onclick="location.reload()">ပြန်လည်ချိတ်ဆက်မည် (Retry)</button>
            </div>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor Live-Update Shell (com.vanguard.arena)
        working-directory: game-apk-build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Vanguard Arena" "com.vanguard.arena" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.vanguard.arena",
            "appName": "Vanguard Arena",
            "webDir": "www",
            "backgroundColor": "#070b14",
            "server": {
              "url": "https://yanlinnaung98.github.io/MyanRena/",
              "androidScheme": "https",
              "errorPath": "index.html"
            },
            "android": {
              "backgroundColor": "#070b14",
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Inject MLBB-Style True Immersive Full-Screen Mode
        working-directory: game-apk-build
        run: |
          cat << 'EOF' > android/app/src/main/java/com/vanguard/arena/MainActivity.java
          package com.vanguard.arena;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableImmersiveMode();
                  }
              }

              private void enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(
                      getWindow(),
                      getWindow().getDecorView()
                  );
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF

      - name: Compile Standalone Live-Update Game APK
        working-directory: game-apk-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Vanguard-Arena-Game.apk

      - name: Upload Vanguard Arena Game APK
        uses: actions/upload-artifact@v7
        with:
          name: Vanguard-Arena-Game-APK
          path: game-apk-build/Vanguard-Arena-Game.apk
