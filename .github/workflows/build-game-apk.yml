name: Build MyanRena Android APK

on:
  push:
    branches: ["main", "feat/android-foundation-phase1"]
    paths:
      - "vanguard-arena/**"
      - ".github/workflows/build-game-apk.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName (for example 1.0.0)
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: Android versionCode (must increase for every APK release)
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: myanrena-android-apk
  cancel-in-progress: false

jobs:
  build-android:
    name: Build MyanRena Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vanguard-arena
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web app dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Install pinned Capacitor 6 toolchain
        run: npm install --no-save --legacy-peer-deps @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

      - name: Generate Android project from committed Capacitor configuration
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Android app version
        env:
          APP_VERSION_NAME: ${{ inputs.version_name }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()
          version_name = os.environ["APP_VERSION_NAME"].strip()
          version_code = os.environ["APP_VERSION_CODE"].strip()
          if not re.fullmatch(r"[0-9]+", version_code) or int(version_code) < 1:
              raise SystemExit("version_code must be a positive integer")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:[-+][A-Za-z0-9.-]+)?", version_name):
              raise SystemExit("version_name must be a valid numeric Android version string")
          text, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text, name_count = re.subn(r"versionName\s+['\"][^'\"]+['\"]", f"versionName '{version_name}'", text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely locate versionCode/versionName in generated Gradle file")
          gradle_file.write_text(text)
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/MyanRena-debug.apk

      - name: Build signed Release APK when signing secrets are configured
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured; skipping signed release APK."
            exit 0
          fi

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/myanrena-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          cat >> android/app/build.gradle <<'GRADLE'

          // CI-only signing configuration. The keystore and credentials are supplied by GitHub Secrets.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

          cd android
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk ../apk-output/MyanRena-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MyanRena-Android-Debug
          path: vanguard-arena/apk-output/MyanRena-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Release APK
        if: ${{ hashFiles('vanguard-arena/apk-output/MyanRena-release.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: MyanRena-Android-Release
          path: vanguard-arena/apk-output/MyanRena-release.apk
          if-no-files-found: error
          retention-days: 30
